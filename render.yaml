services:
  - type: web
    name: doctrust-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      sh -c 'if [ "$DOCTRUST_AUTO_SEED_DEMO_DATA" = "1" ] &&
      [ "$DOCTRUST_DEMO_MODE" = "1" ]; then
      python manage.py seed_demo_data --allow-production-demo
      --allow-ephemeral-demo-files; fi;
      exec gunicorn doctrust.wsgi:application --bind 0.0.0.0:$PORT'
    healthCheckPath: /api/health/
    envVars:
      # Explicit demo-only mode for this intentionally populated demo service.
      # No secrets or database credentials are stored in this Blueprint.
      - key: DOCTRUST_AUTO_SEED_DEMO_DATA
        value: "1"
      - key: DOCTRUST_DEMO_MODE
        value: "1"
      - key: DOCTRUST_DEMO_EPHEMERAL_FILES
        value: "1"
